events {
    worker_connections 1024;
}

http {
    # Definir grupos de servidores internos por microservicio
    upstream auth_upstream {
        server auth-service:8000;
    }

    upstream catalog_upstream {
        server catalog-service:8000;
    }

    upstream booking_upstream {
        server booking-service:8000;
    }

    upstream social_upstream {
        server social-service:3000;
    }

    upstream ai_upstream {
        server ai-service:8000;
    }

    upstream bi_upstream {
        server bi-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Aumentar limite de carga para evidencias ambientales y fotografias
        client_max_body_size 25M;

        # Redirigir rutas de autenticacion y perfiles
        location /api/auth/ {
            proxy_pass http://auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir rutas de catalogo y auditoria sustentable
        location /api/catalog/ {
            proxy_pass http://catalog_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir rutas de reservas, disponibilidad y pagos
        location /api/bookings/ {
            proxy_pass http://booking_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir rutas de resenas y mensajeria directa
        location /api/social/ {
            proxy_pass http://social_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir rutas de recomendaciones y asistente IA
        location /api/ai/ {
            proxy_pass http://ai_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirigir rutas de metricas y panel administrativo BI
        location /api/bi/ {
            proxy_pass http://bi_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}